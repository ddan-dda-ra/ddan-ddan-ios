name: Deploy to App Store

on:
  push:
    # v1.3.3 형식의 태그 푸시에만 실행. 태그 커밋이 main에 포함되는지는
    # 잡 안에서 별도 검증한다 (태그는 브랜치 조건을 걸 수 없음)
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "마케팅 버전 (예: 1.3.3). 비우면 태그(v*.*.*) → APPSTORE_MARKETING_VERSION 변수 → pbxproj 순으로 사용"
        type: string
        required: false

# GITHUB_TOKEN 권한 최소화 (public 레포 안전 조치)
permissions:
  contents: read

concurrency:
  group: appstore-deploy
  cancel-in-progress: false

jobs:
  appstore:
    # 포크에서 워크플로우가 헛돌지 않도록 원본 레포에서만 실행
    if: github.repository_owner == 'ddan-dda-ra'
    runs-on: macos-26
    timeout-minutes: 60
    # GitHub Settings > Environments 에 appstore 환경을 만들고 시크릿 5개 등록,
    # deployment 규칙은 태그 패턴 v*.*.* (+ 수동 실행용 main 브랜치) 허용으로 설정한다
    environment: appstore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # main 포함 여부 검증을 위해 전체 히스토리를 받는다
          fetch-depth: 0

      # 릴리즈 태그가 main에 머지된 커밋을 가리키는지 검증한다.
      # main 밖의 커밋에 태그를 달아 배포하는 실수/우회를 차단.
      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::이 커밋($GITHUB_SHA)은 main에 포함되어 있지 않습니다. main 머지 후 태그를 푸시하세요."
            exit 1
          fi

      # Config*.xcconfig는 gitignore 대상이라 Secrets에서 복원한다.
      # 실배포는 항상 프로덕션 설정(Config.xcconfig)으로만 빌드한다.
      - name: Restore xcconfig files
        env:
          CONFIG_XCCONFIG: ${{ secrets.CONFIG_XCCONFIG }}
          CONFIG_DEV_XCCONFIG: ${{ secrets.CONFIG_DEV_XCCONFIG }}
        run: |
          printf '%s\n' "$CONFIG_XCCONFIG" > Config.xcconfig
          printf '%s\n' "$CONFIG_DEV_XCCONFIG" > Config_dev.xcconfig

      # App Store Connect API 키 (.p8)를 워크스페이스 밖 임시 디렉토리에 복원
      - name: Restore App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }} # .p8 파일의 base64
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      # 클라우드 서명: -allowProvisioningUpdates + ASC API 키로 Xcode가
      # 인증서/프로파일을 자동 생성·관리한다 (match, p12 시크릿 불필요).
      # pbxproj에는 match 수동 서명이 남아 있지만 커맨드라인 오버라이드가 우선한다.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # 버전을 pbxproj 커밋 없이 덮어쓸 수 있다. 우선순위:
          # 수동 실행 입력 > 태그 이름(v1.3.3 → 1.3.3) > APPSTORE_MARKETING_VERSION 변수 > pbxproj
          MARKETING_VERSION_OVERRIDE: ${{ inputs.marketing_version || vars.APPSTORE_MARKETING_VERSION }}
        run: |
          set -o pipefail
          VERSION="${{ inputs.marketing_version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "::notice::태그에서 버전 추출: $VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$MARKETING_VERSION_OVERRIDE"
          fi
          EXTRA_ARGS=()
          if [ -n "$VERSION" ]; then
            EXTRA_ARGS+=("MARKETING_VERSION=$VERSION")
          fi
          xcodebuild archive \
            "${EXTRA_ARGS[@]}" \
            -project DDanDDan.xcodeproj \
            -scheme DDanDDan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DDanDDan.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=65NSM7Z327 \
            | xcbeautify --renderer github-actions

      # ExportOptions.plist의 destination=upload 로 export와 동시에
      # App Store Connect로 업로드한다 (빌드 번호는 ASC 기준 자동 +1).
      # 업로드 후 App Store 버전에 빌드를 연결하고 심사 제출하는 것은
      # App Store Connect에서 수동으로 진행한다.
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DDanDDan.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
