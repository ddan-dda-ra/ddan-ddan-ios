name: Deploy to TestFlight

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      config:
        description: "빌드 설정 (prod = Config.xcconfig, dev = Config_dev.xcconfig)"
        type: choice
        options: [prod, dev]
        default: prod
      marketing_version:
        description: "마케팅 버전 (예: 1.3.3). 비우면 TESTFLIGHT_MARKETING_VERSION 변수 → pbxproj 순으로 사용"
        type: string
        required: false

# GITHUB_TOKEN 권한 최소화 (public 레포 안전 조치)
permissions:
  contents: read

concurrency:
  group: testflight-deploy
  cancel-in-progress: false

jobs:
  testflight:
    # 포크에서 워크플로우가 헛돌지 않도록 원본 레포에서만 실행
    if: github.repository_owner == 'ddan-dda-ra'
    runs-on: macos-26
    timeout-minutes: 60
    # Environment 보호 규칙(배포 브랜치 제한, 시크릿 격리)을 적용하려면
    # GitHub Settings > Environments 에 testflight 환경을 만들고 시크릿을 옮긴다
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Config*.xcconfig는 gitignore 대상이라 Secrets에서 복원한다.
      # 아카이브(Release)는 Config.xcconfig를 참조하므로, 수동 실행에서
      # dev를 고르면 Config.xcconfig 자리에 dev 내용을 채워 빌드한다.
      # push(develop 머지) 트리거는 항상 prod로 빌드된다.
      - name: Restore xcconfig files
        env:
          CONFIG_XCCONFIG: ${{ secrets.CONFIG_XCCONFIG }}
          CONFIG_DEV_XCCONFIG: ${{ secrets.CONFIG_DEV_XCCONFIG }}
          BUILD_CONFIG: ${{ inputs.config || 'prod' }}
        run: |
          if [ "$BUILD_CONFIG" = "dev" ]; then
            echo "::notice::Config_dev.xcconfig 설정으로 빌드합니다"
            printf '%s\n' "$CONFIG_DEV_XCCONFIG" > Config.xcconfig
          else
            printf '%s\n' "$CONFIG_XCCONFIG" > Config.xcconfig
          fi
          printf '%s\n' "$CONFIG_DEV_XCCONFIG" > Config_dev.xcconfig

      # App Store Connect API 키 (.p8)를 워크스페이스 밖 임시 디렉토리에 복원
      - name: Restore App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }} # .p8 파일의 base64
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      # 클라우드 서명: -allowProvisioningUpdates + ASC API 키로 Xcode가
      # 인증서/프로파일을 자동 생성·관리한다 (match, p12 시크릿 불필요).
      # pbxproj에는 match 수동 서명이 남아 있지만 커맨드라인 오버라이드가 우선한다.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # App Store에 이미 출시된 버전으로는 TestFlight 업로드가 거부되므로
          # 버전을 pbxproj 커밋 없이 덮어쓴다. 우선순위:
          # 수동 실행 입력 > TESTFLIGHT_MARKETING_VERSION 변수 > pbxproj
          TF_MARKETING_VERSION: ${{ inputs.marketing_version || vars.TESTFLIGHT_MARKETING_VERSION }}
        run: |
          set -o pipefail
          EXTRA_ARGS=()
          if [ -n "$TF_MARKETING_VERSION" ]; then
            EXTRA_ARGS+=("MARKETING_VERSION=$TF_MARKETING_VERSION")
          fi
          xcodebuild archive \
            "${EXTRA_ARGS[@]}" \
            -project DDanDDan.xcodeproj \
            -scheme DDanDDan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DDanDDan.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=65NSM7Z327 \
            | xcbeautify --renderer github-actions

      # ExportOptions.plist의 destination=upload 로 export와 동시에
      # TestFlight 업로드까지 수행한다 (빌드 번호는 ASC 기준 자동 +1)
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DDanDDan.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
